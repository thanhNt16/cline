syntax = "proto3";

package cline;

import "cline/common.proto";

option go_package = "github.com/cline/grpc-go/cline";
option java_multiple_files = true;
option java_package = "bot.cline.proto";

service DocsIndexService {
  rpc ping(PingRequest) returns (PingResponse);
  rpc listProjects(ListProjectsRequest) returns (ListProjectsResponse);
  rpc createProject(CreateProjectRequest) returns (CreateProjectResponse);
  rpc uploadFile(UploadFileRequest) returns (UploadFileResponse);
  rpc indexUrl(IndexUrlRequest) returns (IndexUrlResponse);
  rpc getTask(TaskStatusRequest) returns (TaskStatusResponse);
  rpc searchDocuments(SearchDocumentsRequest) returns (SearchDocumentsResponse);
  rpc deleteDocument(DeleteDocumentRequest) returns (DeleteDocumentResponse);
  rpc listDocsIndexTools(EmptyRequest) returns (DocsIndexTools);
  rpc registerMcpServer(RegisterMcpRequest) returns (Empty);
  rpc unregisterMcpServer(UnregisterMcpRequest) returns (Empty);
}

message PingRequest {
  string server_url = 1;
}

message PingResponse {
  bool connected = 1;
  string server_version = 2;
}

message ListProjectsRequest {
  string server_url = 1;
}

message ProjectInfo {
  string name = 1;
}

message ListProjectsResponse {
  repeated ProjectInfo projects = 1;
}

message IndexUrlRequest {
  string server_url = 1;
  string project = 2;
  string url = 3;
}

message IndexUrlResponse {
  string task_id = 1;
  string project = 2;
  string status = 3;
}

message UploadFileRequest {
  string server_url = 1;
  string project = 2;
}

message UploadFileResponse {
  string task_id = 1;
  string project = 2;
  string status = 3;
}

message SearchDocumentsRequest {
  string server_url = 1;
  string project = 2;
  string query = 3;
  int32 top_k = 4;
}

message SearchResult {
  double score = 1;
  string doc_id = 2;
  string source_name = 3;
  int32 page = 4;
  int32 chunk_index = 5;
  string text = 6;
}

message SearchDocumentsResponse {
  string project = 1;
  string query = 2;
  repeated SearchResult results = 3;
}

message DocsIndexTool {
  string name = 1;
  string description = 2;
}

message DocsIndexTools {
  repeated DocsIndexTool tools = 1;
}

message RegisterMcpRequest {
  string server_url = 1;
}

message UnregisterMcpRequest {}

message CreateProjectRequest {
  string server_url = 1;
  string name = 2;
}

message CreateProjectResponse {
  string project = 1;
  string status = 2;
}

message DeleteDocumentRequest {
  string server_url = 1;
  string project = 2;
  string source = 3;
}

message DeleteDocumentResponse {
  string status = 1;
}

message TaskStatusRequest {
  string server_url = 1;
  string task_id = 2;
}

message TaskStatusResponse {
  string id = 1;
  string project = 2;
  string status = 3;
  float progress = 4;
  string message = 5;
  string detail = 6;
}
