syntax = "proto3";

package cline;

import "cline/common.proto";

option go_package = "github.com/cline/grpc-go/cline";
option java_multiple_files = true;
option java_package = "bot.cline.proto";

service DocsIndexService {
  rpc ping(PingRequest) returns (PingResponse);
  rpc listProjects(ListProjectsRequest) returns (ListProjectsResponse);
  rpc projectStats(ProjectStatsRequest) returns (ProjectStatsResponse);
  rpc indexDocsProject(DocsIndexProjectRequest) returns (DocsIndexProjectResponse);
  rpc indexUrl(IndexUrlRequest) returns (IndexUrlResponse);
  rpc uploadFile(UploadFileRequest) returns (UploadFileResponse);
  rpc searchDocuments(SearchDocumentsRequest) returns (SearchDocumentsResponse);
  rpc listDocsIndexTools(EmptyRequest) returns (DocsIndexTools);
  rpc registerMcpServer(RegisterMcpRequest) returns (Empty);
  rpc unregisterMcpServer(UnregisterMcpRequest) returns (Empty);
  rpc createProject(CreateProjectRequest) returns (CreateProjectResponse);
  rpc listDocuments(ListDocumentsRequest) returns (ListDocumentsResponse);
  rpc deleteDocument(DeleteDocumentRequest) returns (DeleteDocumentResponse);
  rpc pollIndexJob(PollIndexJobRequest) returns (PollIndexJobResponse);
}

message PingRequest {
  string server_url = 1;
}

message PingResponse {
  bool connected = 1;
  string server_version = 2;
}

message ListProjectsRequest {
  string server_url = 1;
}

message ProjectInfo {
  string name = 1;
  string mount_path = 2;
  int32 total_chunks = 3;
  string status = 4;
}

message ListProjectsResponse {
  repeated ProjectInfo projects = 1;
}

message ProjectStatsRequest {
  string server_url = 1;
  string project = 2;
}

message ProjectStatsResponse {
  string project = 1;
  int32 total_chunks = 2;
  int32 files_indexed = 3;
  map<string, int32> by_format = 4;
}

message DocsIndexProjectRequest {
  string server_url = 1;
  string project = 2;
}

message DocsIndexProjectResponse {
  string job_id = 1;
  string project = 2;
  string status = 3;
  string started_at = 4;
}

message IndexUrlRequest {
  string server_url = 1;
  string project = 2;
  string url = 3;
  int32 depth = 4;
  int32 max_pages = 5;
}

message IndexUrlResponse {
  string job_id = 1;
  string project = 2;
  string status = 3;
  string started_at = 4;
}

message UploadFileRequest {
  string server_url = 1;
  string project = 2;
}

message UploadFileResponse {
  string project = 1;
  string filename = 2;
  string path = 3;
  int64 size = 4;
  string status = 5;
}

message SearchDocumentsRequest {
  string server_url = 1;
  string project = 2;
  string query = 3;
  int32 top_k = 4;
}

message SearchResult {
  string text = 1;
  double score = 2;
  double hybrid_score = 3;
  string metadata = 4;
}

message SearchDocumentsResponse {
  string project = 1;
  string query = 2;
  repeated SearchResult results = 3;
}

message DocsIndexTool {
  string name = 1;
  string description = 2;
}

message DocsIndexTools {
  repeated DocsIndexTool tools = 1;
}

message RegisterMcpRequest {
  string server_url = 1;
}

message UnregisterMcpRequest {}

message CreateProjectRequest {
  string server_url = 1;
  string name = 2;
  string mount_path = 3;
}

message CreateProjectResponse {
  string name = 1;
  string mount_path = 2;
  string status = 3;
  string message = 4;
}

message DocumentInfo {
  string path = 1;
  string file_type = 2;
  int32 chunks = 3;
  int64 size = 4;
  string mod_time = 5;
}

message ListDocumentsRequest {
  string server_url = 1;
  string project = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message ListDocumentsResponse {
  string project = 1;
  int32 page = 2;
  int32 page_size = 3;
  int32 total = 4;
  int32 total_pages = 5;
  repeated DocumentInfo documents = 6;
}

message DeleteDocumentRequest {
  string server_url = 1;
  string project = 2;
  string path = 3;
}

message DeleteDocumentResponse {
  string project = 1;
  string path = 2;
  int32 chunks_removed = 3;
  bool file_deleted = 4;
  string status = 5;
}

message PollIndexJobRequest {
  string server_url = 1;
  string project = 2;
  string job_id = 3;
}

message PollIndexJobResponse {
  string job_id = 1;
  string project = 2;
  string type = 3;
  string status = 4;
  string started_at = 5;
  string finished_at = 6;
  int32 files_scanned = 7;
  int32 files_indexed = 8;
  int32 files_failed = 9;
  int32 chunks_added = 10;
  string error = 11;
}
