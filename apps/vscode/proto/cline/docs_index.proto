syntax = "proto3";

package cline;

import "cline/common.proto";

option go_package = "github.com/cline/grpc-go/cline";
option java_multiple_files = true;
option java_package = "bot.cline.proto";

service DocsIndexService {
  rpc ping(PingRequest) returns (PingResponse);
  rpc listProjects(ListProjectsRequest) returns (ListProjectsResponse);
  rpc createProject(CreateProjectRequest) returns (CreateProjectResponse);
  rpc renameProject(RenameProjectRequest) returns (ProjectMutationResponse);
  rpc deleteProject(DeleteProjectRequest) returns (ProjectMutationResponse);
  rpc uploadFile(UploadFileRequest) returns (UploadFileResponse);
  rpc indexUrl(IndexUrlRequest) returns (IndexUrlResponse);
  rpc indexBatch(IndexBatchRequest) returns (IndexBatchResponse);
  rpc getTask(TaskStatusRequest) returns (TaskStatusResponse);
  rpc searchDocuments(SearchDocumentsRequest) returns (SearchDocumentsResponse);
  rpc deleteDocument(DeleteDocumentRequest) returns (DeleteDocumentResponse);
  rpc listDocuments(ListDocumentsRequest) returns (ListDocumentsResponse);
  rpc indexCodebase(IndexCodebaseRequest) returns (IndexCodebaseResponse);
  rpc startCodebaseWatch(StartCodebaseWatchRequest) returns (CodebaseWatchStatus);
  rpc getCodebaseWatch(GetCodebaseWatchRequest) returns (CodebaseWatchStatus);
  rpc stopCodebaseWatch(GetCodebaseWatchRequest) returns (CodebaseWatchStatus);
  rpc listCodebaseTools(ListCodebaseToolsRequest) returns (CodebaseToolCatalog);
  rpc listDocsIndexTools(EmptyRequest) returns (DocsIndexTools);
  rpc registerMcpServer(RegisterMcpRequest) returns (Empty);
  rpc unregisterMcpServer(UnregisterMcpRequest) returns (Empty);
  rpc getDocsIndexSettings(EmptyRequest) returns (GetDocsIndexSettingsResponse);
  rpc updateDocsIndexSettings(UpdateDocsIndexSettingsRequest) returns (UpdateDocsIndexSettingsResponse);
}

message PingRequest {
  string server_url = 1;
}

message PingResponse {
  bool connected = 1;
  string server_version = 2;
}

message ListProjectsRequest {
  string server_url = 1;
}

message ProjectInfo {
  string name = 1;
}

message ListProjectsResponse {
  repeated ProjectInfo projects = 1;
}

message IndexUrlRequest {
  string server_url = 1;
  string project = 2;
  string url = 3;
}

message IndexUrlResponse {
  string task_id = 1;
  string project = 2;
  string status = 3;
}

message UploadFileRequest {
  string server_url = 1;
  string project = 2;
}

message UploadFileResponse {
  string task_id = 1;
  string project = 2;
  string status = 3;
}

message SearchDocumentsRequest {
  string server_url = 1;
  string project = 2;
  string query = 3;
  int32 top_k = 4;
}

message SearchResult {
  double score = 1;
  string doc_id = 2;
  string source_name = 3;
  int32 page = 4;
  int32 chunk_index = 5;
  string text = 6;
}

message SearchDocumentsResponse {
  string project = 1;
  string query = 2;
  repeated SearchResult results = 3;
}

message DocsIndexTool {
  string name = 1;
  string description = 2;
}

message DocsIndexTools {
  repeated DocsIndexTool tools = 1;
}

message RegisterMcpRequest {
  string server_url = 1;
}

message UnregisterMcpRequest {}

message CreateProjectRequest {
  string server_url = 1;
  string name = 2;
}

message CreateProjectResponse {
  string project = 1;
  string status = 2;
}

message RenameProjectRequest {
  string server_url = 1;
  string project = 2;
  string new_name = 3;
}

message DeleteProjectRequest {
  string server_url = 1;
  string project = 2;
}

// Shared reply for rename/delete: echoes the affected project and "ok"/"error".
message ProjectMutationResponse {
  string project = 1;
  string status = 2;
  string error = 3;
}

message DeleteDocumentRequest {
  string server_url = 1;
  string project = 2;
  string source = 3;
}

message DeleteDocumentResponse {
  string status = 1;
}

message ListDocumentsRequest {
  string server_url = 1;
  string project = 2;
}

message DocumentInfo {
  string source = 1;
  int64 bytes = 2;
  int32 page_count = 3;
  int32 chunk_count = 4;
  string content_hash = 5;
  string url = 6;
}

message ListDocumentsResponse {
  repeated DocumentInfo documents = 1;
}

message IndexBatchRequest {
  string server_url = 1;
  string project = 2;
  repeated string urls = 3;
}

message IndexBatchResponse {
  string task_id = 1;
}

message TaskStatusRequest {
  string server_url = 1;
  string task_id = 2;
}

message TaskStatusResponse {
  string id = 1;
  string project = 2;
  string status = 3;
  float progress = 4;
  string message = 5;
  string detail = 6;
}

// `path` resolves on the docindex server host, not on the client machine.
message IndexCodebaseRequest {
  string server_url = 1;
  string project = 2;
  string path = 3;
}

message IndexCodebaseResponse {
  string task_id = 1;
  string status = 2;
  string error = 3;
}

message StartCodebaseWatchRequest {
  string server_url = 1;
  string project = 2;
  string path = 3;
  // Server floors this at 5 seconds.
  int32 debounce_secs = 4;
}

message GetCodebaseWatchRequest {
  string server_url = 1;
  string project = 2;
}

// active=false is the normal "not watched" state (server replies 404), not an error.
// The server only echoes path/debounce_secs on start; a status read omits them.
message CodebaseWatchStatus {
  bool active = 1;
  string path = 2;
  int32 debounce_secs = 3;
  string last_trigger = 4;
  string last_index = 5;
  string error = 6;
}

message ListCodebaseToolsRequest {
  string server_url = 1;
}

message CodebaseToolInfo {
  string name = 1;
  string tool = 2;
  string description = 3;
  bool is_readonly = 4;
}

message CodebaseToolCatalog {
  repeated CodebaseToolInfo tools = 1;
}

message GetDocsIndexSettingsResponse {
  string server_url = 1;
  string last_selected_project = 2;
}

message UpdateDocsIndexSettingsRequest {
  string workspace_path = 1;
  optional string server_url = 2;
  optional string selected_project = 3;
}

message UpdateDocsIndexSettingsResponse {
  string server_url = 1;
  string last_selected_project = 2;
}
